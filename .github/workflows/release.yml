name: Release

# Every push to main builds the app and publishes it as a new GitHub release.
#
# The version comes from package.json. If that version has already been
# released, the next free patch number is used (1.4.0, 1.4.1, 1.4.2, ...).
# To start a new series, bump the major or minor version in package.json.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
      - 'docs/**'
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, for the version and release notes

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Pick version
        id: version
        run: |
          base=$(node -p "require('./package.json').version")
          series=${base%.*}
          if git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
            last=$(git tag -l "v$series.*" | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k3,3n | tail -1)
            version="$series.$(( ${last##*.} + 1 ))"
          else
            version=$base
          fi
          previous=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          {
            echo "## Download"
            echo
            echo "- **Apple Silicon (M1 or newer):** AutoClicker-for-Mac-$VERSION-arm64.dmg"
            echo "- **Intel:** AutoClicker-for-Mac-$VERSION-x64.dmg"
            echo
            echo "Open the DMG and drag AutoClicker for Mac into Applications. The app isn't notarized by Apple, so the first time you open it macOS will block it: go to **System Settings → Privacy & Security** and click **Open Anyway**."
            echo
            echo "**Updating?** macOS may keep the old Accessibility approval. If clicking doesn't work, remove AutoClicker for Mac from **System Settings → Privacy & Security → Accessibility** with the – button, then open the app and switch it on again."
            echo
            echo "## What's new"
            echo
            # List commits users would notice; leave out ones that only touch
            # docs, tests or CI.
            if [ -n "$PREVIOUS" ]; then range="$PREVIOUS..HEAD"; else range="-20"; fi
            changes=$(git log --no-merges --format=%H $range | while read -r sha; do
              if git diff-tree --no-commit-id --name-only -r "$sha" | grep -vE '\.md$|^LICENSE$|^docs/|^test/|^\.github/' >/dev/null; then
                git log -1 --format='- %s' "$sha"
              fi
            done)
            echo "${changes:-- Maintenance and build updates}"
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...v$VERSION"
            fi
          } > release-notes.md
          gh release create "v$VERSION" dist/*.dmg \
            --target "$GITHUB_SHA" \
            --title "AutoClicker for Mac v$VERSION" \
            --notes-file release-notes.md
